# ===================================================================
# Production Spring Boot Profile (activate via SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# Strict schema validation against live Supabase PostgreSQL (zero unexpected DDL changes)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Never expose internal stacktraces or default error attributes
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Graceful shutdown & resource protection
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=15
server.tomcat.accept-count=150
server.tomcat.connection-timeout=15000
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging hygiene
logging.level.root=WARN
logging.level.com.socialshuffle=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
