# ===================================================================
# Social Shuffle - Spring Boot & Supabase PostgreSQL Configuration
# Compatible with Supabase PostgreSQL, Cloud Native, Docker & Local
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# -------------------------------------------------------------------
# PostgreSQL Database Connection (Supabase Cloud PostgreSQL)
# -------------------------------------------------------------------
# Direct Supabase Connection string: postgresql://postgres:u7ihNL9yTUg8MnTw@db.pngqqlrrqovdkzvljgjc.supabase.co:5432/postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db.pngqqlrrqovdkzvljgjc.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:u7ihNL9yTUg8MnTw}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool: Low Latency, High Concurrency, Zero Leak
spring.datasource.hikari.pool-name=SocialShuffleHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# Hibernate / JPA Configuration (PostgreSQL Dialect & Auto Schema Sync)
# -------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Batching inserts & updates to eliminate round-trip network overhead
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app,https://ais-pre-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app

# -------------------------------------------------------------------
# Cryptographic Token & Authentication Security
# -------------------------------------------------------------------
app.security.jwt-secret=${APP_JWT_SECRET:SocialShuffleSuperSecureHMAC256KeyPuneCommunityBoardGames2026!}

# -------------------------------------------------------------------
# Secure Logging (No SQL Parameter or Credential Leaks in Production Logs)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
