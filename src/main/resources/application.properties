# ===================================================================
# Social Shuffle - Spring Boot & MySQL Hardened Security Configuration
# Compatible with GoDaddy cPanel MySQL, Local MySQL 8.x, and AWS RDS
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection (Zero Public Exposure)
# -------------------------------------------------------------------
# Database must bind to localhost / private network only (bind-address = 127.0.0.1)
# No remote open ports; API proxies all database queries.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:social_shuffle}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=false&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Security & Health
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# Hibernate / JPA Configuration (Sanitized Queries & Zero SQL Leaks)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app,https://ais-pre-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app

# -------------------------------------------------------------------
# Cryptographic Token & Authentication Security
# -------------------------------------------------------------------
app.security.jwt-secret=${APP_JWT_SECRET:SocialShuffleSuperSecureHMAC256KeyPuneCommunityBoardGames2026!}

# -------------------------------------------------------------------
# Secure Logging (No SQL Parameter or Credential Leaks in Production Logs)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
