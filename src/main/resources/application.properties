# ===================================================================
# Social Shuffle - Spring Boot & MySQL Hardened Security Configuration
# Compatible with GoDaddy cPanel MySQL, Local MySQL 8.x, and AWS RDS
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection (Zero Public Exposure & High Performance)
# -------------------------------------------------------------------
# Database must bind to localhost / private network only (bind-address = 127.0.0.1)
# Optimized with client-side statement caching, server prepared statements, batched rewrites, and session caching.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:social_shuffle}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=false&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&rewriteBatchedStatements=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&elideSetAutoCommits=true&maintainTimeStats=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool: Low Latency, High Concurrency, Zero Leak
spring.datasource.hikari.pool-name=SocialShuffleHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# Hibernate / JPA Configuration (High Throughput Batching & Zero SQL Leaks)
# -------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Batching inserts & updates to eliminate round-trip network overhead
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app,https://ais-pre-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app

# -------------------------------------------------------------------
# Cryptographic Token & Authentication Security
# -------------------------------------------------------------------
app.security.jwt-secret=${APP_JWT_SECRET:SocialShuffleSuperSecureHMAC256KeyPuneCommunityBoardGames2026!}

# -------------------------------------------------------------------
# Secure Logging (No SQL Parameter or Credential Leaks in Production Logs)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
