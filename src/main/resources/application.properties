# ===================================================================
# Social Shuffle - Spring Boot & MySQL Configuration
# Compatible with GoDaddy cPanel MySQL, Local MySQL 8.x, and AWS RDS
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection (GoDaddy / Local)
# -------------------------------------------------------------------
# By default, reads environment variables (MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD)
# If running locally or on GoDaddy cPanel:
#   - In GoDaddy cPanel, database names & users often have prefixes (e.g. cpuser_socialshuffle)
#   - Default host for GoDaddy web apps running on the same server is localhost
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:social_shuffle}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
# 'update' automatically creates/updates tables according to the Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app,https://ais-pre-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=INFO
logging.level.org.hibernate.SQL=DEBUG
