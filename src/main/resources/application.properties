# ===================================================================
# Social Shuffle - Spring Boot & Supabase PostgreSQL Configuration
# Compatible with Supabase PostgreSQL, Cloud Native, Docker & STS Local
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# HTTP Response Compression for faster JSON API payloads
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# -------------------------------------------------------------------
# PostgreSQL Database Connection (Supabase IPv4 Pooler & Cloud Ready)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-southeast-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&reWriteBatchedInserts=true&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5&tcpKeepAlive=true}
spring.datasource.username=${DB_USER:postgres.pngqqlrrqovdkzvljgjc}
spring.datasource.password=${DB_PASSWORD:u7ihNL9yTUg8MnTw}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool: Low Latency, High Concurrency, Zero Leak
spring.datasource.hikari.pool-name=SocialShuffleHikariPool
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# -------------------------------------------------------------------
# Hibernate / JPA Configuration (PostgreSQL Dialect & Batch Tuning)
# -------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Batching inserts, updates, and fetches to minimize DB round-trips
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# -------------------------------------------------------------------
# Backend API Endpoint & Frontend Integration URLs
# -------------------------------------------------------------------
app.api.endpoint=${APP_API_ENDPOINT:http://localhost:8080/api}
app.api.base-url=${APP_API_BASE_URL:http://localhost:8080/api}
app.api.public-url=${APP_API_PUBLIC_URL:http://localhost:3000}
backend.api.endpoint=${BACKEND_API_ENDPOINT:http://localhost:8080/api}

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# -------------------------------------------------------------------
# Cryptographic Token & Authentication Security
# -------------------------------------------------------------------
app.security.jwt-secret=${APP_JWT_SECRET:SocialShuffleSuperSecureHMAC256KeyPuneCommunityBoardGames2026!}
app.security.token-validity-ms=${APP_TOKEN_VALIDITY_MS:2592000000}

# -------------------------------------------------------------------
# Email / SMTP & Communications Configuration (DB app_configs overrides env)
# -------------------------------------------------------------------
app.mail.host=${SMTP_HOST:smtp.gmail.com}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USER:}
app.mail.password=${SMTP_PASS:}
app.mail.from=${SMTP_FROM:}
app.mail.admin-email=${ADMIN_NOTIFICATION_EMAIL:parimalmshete@gmail.com}
app.mail.resend-api-key=${RESEND_API_KEY:}

# -------------------------------------------------------------------
# Razorpay Configuration (DB app_configs overrides env)
# -------------------------------------------------------------------
app.razorpay.key-id=${RAZORPAY_KEY_ID:${VITE_RAZORPAY_KEY_ID:rzp_test_SocialShufflePune}}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# -------------------------------------------------------------------
# Secure Logging
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
